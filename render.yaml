services:
  - type: web
    name: ai-resume-matcher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', device='cpu')"
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.fileWatcherType none
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: HF_HOME
        value: /opt/render/project/src/.hf-cache
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
